name: kainuwa_studio
description: Offline course video maker for Kainuwa Academy.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  kainuwa_encoder:
    path: packages/kainuwa_encoder
  photo_manager: ^3.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/backgrounds/
    - assets/icons/
    - assets/illustrations/
