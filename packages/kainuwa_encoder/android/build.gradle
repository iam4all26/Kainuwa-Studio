group = 'com.kainuwa.encoder'
version = '1.0'

apply plugin: 'com.android.library'

android {
    namespace = 'com.kainuwa.encoder'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs += [layout.buildDirectory.dir('sherpa/jniLibs/jniLibs').get().asFile]
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

// The sherpa-onnx native libraries (offline neural voice) are downloaded once at build time,
// only for the two phone processor types.
tasks.register('fetchSherpaLibs') {
    def archive = layout.buildDirectory.file('sherpa/android.tar.bz2').get().asFile
    def outDir = layout.buildDirectory.dir('sherpa/jniLibs').get().asFile
    outputs.dir(outDir)
    doLast {
        if (new File(outDir, 'jniLibs/arm64-v8a/libsherpa-onnx-jni.so').exists()
                && new File(outDir, 'jniLibs/armeabi-v7a/libsherpa-onnx-jni.so').exists()) {
            return
        }
        archive.parentFile.mkdirs()
        new URL('https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-v2.0.3-android.tar.bz2')
                .withInputStream { i -> archive.withOutputStream { o -> o << i } }
        copy {
            from tarTree(resources.bzip2(archive))
            include '**/arm64-v8a/libsherpa-onnx-jni.so', '**/arm64-v8a/libonnxruntime.so'
            include '**/armeabi-v7a/libsherpa-onnx-jni.so', '**/armeabi-v7a/libonnxruntime.so'
            includeEmptyDirs = false
            into outDir
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'fetchSherpaLibs' }

dependencies {
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
}
